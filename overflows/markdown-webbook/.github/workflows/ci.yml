name: CI

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The verification stack (jsdom 30 + undici 8) declares engines
          # "^22.22.2 || ^24.15.0 || >=26.0.0"; on Node 20 `require("jsdom")`
          # crashes inside undici ("webidl.util.markAsUncloneable is not a
          # function"). Node 24 is the line the harness is developed on.
          node-version: 24

      - name: Install verification dependencies (jsdom)
        run: npm install

      - name: Build the artifact (-> dist/)
        run: npm run build

      - name: Verify the committed artifact is reproducible
        run: |
          git diff --exit-code --stat -- dist/ \
            || (echo "::error::dist/markdown_webbook.html does not match the sources — run 'node build.js' and commit the result" && exit 1)

      - name: Verify (182-check jsdom suite)
        run: npm run verify

      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown_webbook-${{ github.sha }}
          path: dist/markdown_webbook.html
